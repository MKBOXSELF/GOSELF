<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MK_GO_FUEL_SELF</title>

    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org">

    <style>
        :root {
            --primary-blue: #0066B3;
            --secondary-blue: #0099CC;
            --accent-orange: #FF6600;
            --success-green: #28A745;
            --bg: #f5f5f5;
            --text: #1f1f1f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }

        #app {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            min-height: 44px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .header-btn {
            background: rgba(255,255,255,0.18);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        #map {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #eef3f8;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.97);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            transition: opacity 0.25s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            min-width: 280px;
            max-width: 90vw;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 22px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 4px solid #edf3f9;
            border-top-color: var(--primary-blue);
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-blue);
            text-align: center;
        }

        .loading-progress-container {
            width: 100%;
            height: 8px;
            background: #ececec;
            border-radius: 999px;
            overflow: hidden;
        }

        .loading-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--secondary-blue));
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .loading-percent {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-blue);
        }

        .toast {
            position: fixed;
            top: 60px;
            right: 16px;
            background: white;
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            z-index: 5000;
            font-size: 12px;
        }

        @media (max-width: 540px) {
            .brand { font-size: 13px; }
            .header-btn { padding: 5px 8px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="brand">⛽ MK_GO_FUEL_SELF</div>
            <div class="header-actions">
                <button class="header-btn" onclick="getCurrentLocation()">📍 Posizione</button>
                <button class="header-btn" onclick="location.reload()">🔄 Aggiorna</button>
            </div>
        </header>
        <div id="map"></div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div id="loadingText" class="loading-text">Caricamento dati...</div>
            <div class="loading-progress-container">
                <div id="loadingProgressBar" class="loading-progress-bar"></div>
            </div>
            <div id="loadingPercent" class="loading-percent">0%</div>
        </div>
    </div>

    <script>
        window.__appState = {
            map: null,
            markerGroup: null,
            data: [],
            loaded: false
        };

        function setLoading(pct, text) {
            const bar = document.getElementById('loadingProgressBar');
            const label = document.getElementById('loadingText');
            const percent = document.getElementById('loadingPercent');
            if (bar) bar.style.width = pct + '%';
            if (label && text) label.textContent = text;
            if (percent) percent.textContent = pct + '%';
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        function loadScript(src) {
            return new Promise((resolve) => {
                const existing = document.querySelector('script[src="' + src + '"]');
                if (existing) {
                    if (existing.dataset.loaded === '1') return resolve();
                    existing.addEventListener('load', () => resolve(), { once: true });
                    return;
                }

                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => {
                    s.dataset.loaded = '1';
                    resolve();
                };
                s.onerror = () => resolve();
                document.head.appendChild(s);
            });
        }

        function loadLeaflet() {
            return Promise.all([
                loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'),
                loadScript('https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js')
            ]).then(() => {
                const css = document.createElement('link');
                css.rel = 'stylesheet';
                css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                document.head.appendChild(css);

                const css2 = document.createElement('link');
                css2.rel = 'stylesheet';
                css2.href = 'https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css';
                document.head.appendChild(css2);

                const css3 = document.createElement('link');
                css3.rel = 'stylesheet';
                css3.href = 'https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css';
                document.head.appendChild(css3);
            });
        }

        function initMap() {
            if (!window.L) return;
            const map = L.map('map', { zoomControl: true }).setView([41.8719, 12.5674], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            window.__appState.map = map;
        }

        function addStationsInBatches(data) {
            if (!window.__appState.map || !window.L) return;

            const group = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 45 });
            window.__appState.markerGroup = group;
            window.__appState.map.addLayer(group);

            const batchSize = 120;
            let index = 0;

            function renderNextBatch() {
                const limit = Math.min(index + batchSize, data.length);
                for (; index < limit; index++) {
                    const st = data[index];
                    if (!st || !st.lat || !st.lng) continue;
                    const marker = L.marker([st.lat, st.lng]);
                    const name = st.name || st.brand || 'Stazione';
                    const price = st.price || st.prezzo || 'N/A';
                    marker.bindPopup('<div style="min-width:180px"><strong>' + name + '</strong><br>Prezzo: ' + price + '</div>');
                    group.addLayer(marker);
                }

                setLoading(Math.min(95, 30 + (index / Math.max(data.length, 1)) * 65), 'Aggiornamento mappe...');

                if (index < data.length) {
                    requestAnimationFrame(renderNextBatch);
                } else {
                    setLoading(100, 'Pronto!');
                    setTimeout(hideLoading, 350);
                }
            }

            renderNextBatch();
        }

        async function loadData() {
            const url = 'https://mkboxself.github.io/fuel-data/stations.json';
            const response = await fetch(url, { cache: 'no-cache' });
            if (!response.ok) throw new Error('Dati non disponibili');
            const json = await response.json();
            return Array.isArray(json) ? json : Object.values(json || {});
        }

        async function bootstrap() {
            try {
                setLoading(5, 'Inizializzazione...');

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw-cache.js').catch(() => {});
                }

                setLoading(15, 'Caricamento librerie...');
                await loadLeaflet();
                initMap();

                setLoading(30, 'Download dati...');
                const data = await loadData();
                if (!data || data.length === 0) throw new Error('Nessun dato trovato');

                window.__appState.data = data;
                addStationsInBatches(data);
            } catch (err) {
                console.error(err);
                setLoading(0, 'Errore caricamento');
                showToast('Errore caricamento dati');
                setTimeout(() => location.reload(), 2500);
            }
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                showToast('Geolocalizzazione non supportata');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    if (window.__appState.map) {
                        window.__appState.map.setView([latitude, longitude], 12);
                    }
                    showToast('Posizione aggiornata');
                },
                () => showToast('Impossibile ottenere la posizione'),
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        window.addEventListener('load', bootstrap);
    </script>
</body>
</html>
